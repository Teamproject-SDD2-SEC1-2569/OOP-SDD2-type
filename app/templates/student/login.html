<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบห้องเรียนฝึกพิมพ์</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, "Tahoma", sans-serif; background: #f4f8fc; color: #3d4652; }
        .page { min-height: 100vh; display: flex; }
        .left-section { width: 55%; min-height: 100vh; background: linear-gradient(135deg, #ffffff 0%, #f1f8ff 100%); display: flex; flex-direction: column; align-items: center; padding-top: 90px; position: relative; overflow: hidden; }
        .brand { text-align: center; z-index: 2; }
        .brand h1 { font-size: 38px; color: #34445a; margin-bottom: 12px; }
        .brand p { font-size: 20px; color: #718096; }
        .illustration { position: relative; width: 500px; height: 430px; margin-top: 45px; background: #e8f4ff; border-radius: 40% 40% 0 0; display: flex; align-items: center; justify-content: center; }
        .student { font-size: 210px; position: absolute; left: 100px; bottom: 75px; }
        .laptop { font-size: 130px; position: absolute; right: 55px; bottom: 40px; }
        .plant { font-size: 70px; position: absolute; left: 20px; bottom: 25px; }
        .right-section { width: 45%; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f7f9fc; }
        .login-card { width: 520px; max-width: calc(100% - 40px); background: white; border-radius: 24px; padding: 45px 48px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08); }
        .login-card h2 { text-align: center; font-size: 28px; color: #536579; margin-bottom: 30px; }
        .role-buttons { display: flex; gap: 15px; margin-bottom: 22px; }
        .role { flex: 1; padding: 15px; border-radius: 14px; border: 1px solid #d8dee8; background: white; color: #687587; font-size: 17px; cursor: pointer; }
        .role.active { background: #5b9fe8; border-color: #5b9fe8; color: white; }
        .input-box { height: 58px; border: 1px solid #d9dfe8; border-radius: 14px; display: flex; align-items: center; padding: 0 16px; margin-bottom: 15px; background: white; }
        .input-box span { font-size: 20px; margin-right: 12px; }
        .input-box input { flex: 1; min-width: 0; border: none; outline: none; font-size: 16px; color: #444; background: transparent; }
        .input-box input::placeholder { color: #9aa4b2; }
        .eye { cursor: pointer; margin-right: 0 !important; }
        .login-button { width: 100%; height: 58px; border: none; border-radius: 14px; background: #579be8; color: white; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .login-button:hover { background: #438bdc; }
        .or { text-align: center; color: #9aa3af; margin: 25px 0; font-size: 16px; }
        .google-button { width: 100%; height: 55px; border-radius: 14px; border: 1px solid #d9dfe8; background: white; color: #687587; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, box-shadow 0.2s; }
        .google-button:hover { background: #f8fafd; box-shadow: 0 4px 12px rgba(66, 133, 244, 0.12); border-color: #b8ccf4; }
        .google { color: #4285f4; font-size: 22px; font-weight: bold; margin-right: 10px; }
        .google-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .google-modal-overlay.active { display: flex; }
        .google-modal { width: 420px; max-width: 100%; background: #fff; border-radius: 20px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18); text-align: center; }
        .google-modal-logo { font-size: 36px; font-weight: bold; color: #4285f4; margin-bottom: 8px; }
        .google-modal h3 { font-size: 21px; color: #202124; margin-bottom: 6px; }
        .google-modal p { font-size: 14px; color: #5f6368; margin-bottom: 20px; }
        .google-modal input { width: 100%; height: 48px; border: 1px solid #dadce0; border-radius: 10px; padding: 0 14px; font-size: 15px; margin-bottom: 12px; outline: none; }
        .google-modal input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.15); }
        .google-modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .google-modal-cancel { flex: 1; height: 44px; border: 1px solid #dadce0; border-radius: 10px; background: white; color: #5f6368; font-size: 15px; cursor: pointer; }
        .google-modal-submit { flex: 1; height: 44px; border: none; border-radius: 10px; background: #1a73e8; color: white; font-size: 15px; font-weight: bold; cursor: pointer; }
        .google-modal-submit:hover { background: #1557b0; }
        .register { text-align: center; margin-top: 25px; color: #8a94a3; font-size: 15px; }
        .register a { color: #4d96e6; text-decoration: none; font-weight: bold; }
        .register a:hover { text-decoration: underline; }
        @media (max-width: 900px) {
            .page { flex-direction: column; }
            .left-section { width: 100%; min-height: 45vh; padding-top: 40px; }
            .right-section { width: 100%; padding: 30px 0; }
            .illustration { transform: scale(0.7); transform-origin: top center; margin-top: 20px; margin-bottom: -120px; }
            .brand h1 { font-size: 28px; } .brand p { font-size: 16px; }
        }
        @media (max-width: 480px) {
            .login-card { padding: 30px 22px; } .login-card h2 { font-size: 23px; } .role { padding: 12px 8px; font-size: 15px; }
        }
    </style>
</head>

<body>

    <div class="page">
        <section class="left-section">
            <div class="brand">
                <h1>ระบบห้องเรียนฝึกพิมพ์</h1>
                <p>ติดตามพัฒนาการพิมพ์ของนักเรียน</p>
            </div>
            <div class="illustration">
                <div class="plant">🌱</div>
                <div class="student">👩🏻‍💻</div>
                <div class="laptop">💻</div>
            </div>
        </section>

        <section class="right-section">
            <div class="login-card">
                <h2>เข้าสู่ระบบ / สมัครสมาชิก</h2>

                <div class="role-buttons">
                    <button type="button" class="role active">👤 นักเรียน</button>
                    <button type="button" class="role">🎓 อาจารย์</button>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-box">
                        <span>👤</span>
                        <input type="text" name="username" placeholder="ชื่อผู้ใช้ / อีเมล" required>
                    </div>

                    <div class="input-box">
                        <span>🔒</span>
                        <input type="password" id="passwordInput" name="password" placeholder="รหัสผ่าน" required>
                        <span class="eye" onclick="togglePassword()">👁</span>
                    </div>

                    <button type="submit" class="login-button">เข้าสู่ระบบ</button>
                </form>

                <div class="or">หรือ</div>

                <button type="button" class="google-button" onclick="handleGoogleLogin()">
                    <span class="google">G</span> เข้าสู่ระบบด้วย Google
                </button>

                <p class="register">
                    ยังไม่มีบัญชี?
                    <a href="{{ url_for('api.register') }}">สมัครสมาชิก</a>
                </p>
            </div>
        </section>
    </div>

    <!-- Google Sign-In Modal -->
    <div id="googleModal" class="google-modal-overlay" onclick="if(event.target === this) closeGoogleModal()">
        <div class="google-modal">
            <div class="google-modal-logo">G</div>
            <h3>เข้าสู่ระบบด้วย Google</h3>
            <p id="googleRoleSubtitle">ดำเนินการต่อในฐานะ นักเรียน</p>
            <form onsubmit="submitGoogleModal(event)">
                <input type="email" id="googleEmailInput" placeholder="อีเมล Google (เช่น example@gmail.com)" required>
                <input type="text" id="googleNameInput" placeholder="ชื่อ-นามสกุล (หากเข้าใช้งานครั้งแรก)">
                <div class="google-modal-actions">
                    <button type="button" class="google-modal-cancel" onclick="closeGoogleModal()">ยกเลิก</button>
                    <button type="submit" class="google-modal-submit">ดำเนินการต่อ</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        const GOOGLE_CLIENT_ID = "{{ google_client_id or config.get('GOOGLE_CLIENT_ID', '') }}";

        // เปิด/ปิด การมองเห็นรหัสผ่าน
        function togglePassword() {
            const pwdInput = document.getElementById("passwordInput");
            pwdInput.type = pwdInput.type === "password" ? "text" : "password";
        }

        // จัดการคลิกเลือก Role (นักเรียน/อาจารย์)
        let selectedRole = "Student"; // ค่าเริ่มต้น
        const roles = document.querySelectorAll(".role");
        
        roles.forEach(role => {
            role.addEventListener("click", () => {
                // ลบ class active ออกจากทุกปุ่ม
                roles.forEach(r => r.classList.remove("active"));
                // เพิ่ม class active ให้ปุ่มที่ถูกคลิก
                role.classList.add("active");
                
                // เก็บค่า Role ที่เลือก
                if (role.innerText.includes("อาจารย์")) {
                    selectedRole = "Teacher";
                } else {
                    selectedRole = "Student";
                }
            });
        });

        function handleAuthSuccess(data, fallbackIdentifier) {
            const token = data.access_token || data.token;
            if (token) {
                localStorage.setItem("token", token);
                localStorage.setItem("accessToken", token);
            }
            if (data.user) {
                localStorage.setItem("user", JSON.stringify(data.user));
                localStorage.setItem("username", data.user.username || fallbackIdentifier);
            }

            // 🌟 เช็ก Role จริงจาก Database เพื่อ Redirect 🌟
            const userRole = data.user?.role;
            if (userRole === "Teacher") {
                window.location.href = "{{ url_for('teacher.teacher_dashboard_page') }}";
            } else {
                window.location.href = "{{ url_for('api.classroom') }}";
            }
        }

        // จัดการเมื่อกดปุ่มล็อกอินปกติ
        async function handleLogin(e) {
            e.preventDefault(); // ป้องกันไม่ให้หน้าเว็บรีเฟรช

            // ดึงค่าจากฟอร์ม
            const emailOrUsername = document.querySelector('input[name="username"]').value;
            const password = document.querySelector('input[name="password"]').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: emailOrUsername,
                        email: emailOrUsername,
                        password: password,
                        role: selectedRole
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    handleAuthSuccess(data, emailOrUsername);
                } else {
                    alert("เข้าสู่ระบบไม่สำเร็จ: " + (data.message || data.error || "กรุณาลองใหม่อีกครั้ง"));
                }
            } catch (error) {
                console.error("Error during login:", error);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
            }
        }

        // จัดการเมื่อกดปุ่ม "เข้าสู่ระบบด้วย Google"
        function handleGoogleLogin() {
            // ถ้าตั้งค่า GOOGLE_CLIENT_ID ใน .env ให้ใช้ Google OAuth 2.0 ของจริง
            if (GOOGLE_CLIENT_ID) {
                if (window.google && google.accounts && google.accounts.oauth2) {
                    const tokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: 'email profile openid',
                        callback: async (tokenResponse) => {
                            if (tokenResponse && tokenResponse.access_token) {
                                await loginWithGoogleBackend("", "", tokenResponse.access_token);
                            }
                        }
                    });
                    tokenClient.requestAccessToken({ prompt: 'select_account' });
                    return;
                }
                // Fallback ไปยัง OAuth 2.0 Redirect Flow
                window.location.href = `/auth/google/oauth?role=${encodeURIComponent(selectedRole)}`;
                return;
            }

            // กรณียังไม่ได้ใส่ GOOGLE_CLIENT_ID ใน .env ให้แสดงหน้าต่างเข้าสู่ระบบด้วยบัญชี Google
            const roleLabel = selectedRole === "Teacher" ? "อาจารย์ (Teacher)" : "นักเรียน (Student)";
            document.getElementById("googleRoleSubtitle").innerText = `ดำเนินการต่อในฐานะ ${roleLabel}`;
            document.getElementById("googleModal").classList.add("active");
            document.getElementById("googleEmailInput").focus();
        }

        function closeGoogleModal() {
            document.getElementById("googleModal").classList.remove("active");
        }

        async function submitGoogleModal(e) {
            e.preventDefault();
            const email = document.getElementById("googleEmailInput").value.trim();
            const fullName = document.getElementById("googleNameInput").value.trim();
            if (!email) return;
            closeGoogleModal();
            await loginWithGoogleBackend(email, fullName, "");
        }

        async function loginWithGoogleBackend(email, fullName, googleAccessToken = "") {
            try {
                const response = await fetch('/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        full_name: fullName,
                        access_token: googleAccessToken,
                        role: selectedRole
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.needs_registration && data.redirect_url) {
                        alert(data.message || "บัญชี Google นี้ยังไม่เคยสมัครสมาชิก กรุณากรอกข้อมูลเพื่อสมัครสมาชิกก่อน");
                        window.location.href = data.redirect_url;
                        return;
                    }
                    handleAuthSuccess(data, email);
                } else {
                    alert("เข้าสู่ระบบด้วย Google ไม่สำเร็จ: " + (data.message || data.error || "กรุณาลองใหม่อีกครั้ง"));
                }
            } catch (error) {
                console.error("Error during Google login:", error);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
            }
        }
    </script>
</body>

</html>
