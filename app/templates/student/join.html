<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ห้องเรียน - ระบบฝึกพิมพ์</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', 'Inter', sans-serif; }
        body { 
            background-color: #F4F7FC; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            background-image: url('https://placehold.co/1440x400/EBF5FE/EBF5FE?text=Background'); 
            background-position: bottom; 
            background-repeat: no-repeat; 
            background-size: 100% auto;
        }

        .join-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .card {
            background-color: #fff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(6, 51, 118, 0.08);
            text-align: center;
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            background-color: #EBF5FE;
            color: #288CF0;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
        }

        h1 {
            color: #063376;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #6F8DBA;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #063376;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #A0D5FA;
            font-size: 18px;
        }

        .form-input {
            width: 100%;
            height: 55px;
            border-radius: 14px;
            border: 2px solid #EBF5FE;
            padding: 0 15px 0 50px;
            font-size: 16px;
            color: #063376;
            font-weight: 500;
            outline: none;
            transition: 0.3s;
            background-color: #F9FCFF;
        }

        .form-input:focus {
            border-color: #288CF0;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(40, 140, 240, 0.1);
        }

        .form-input::placeholder {
            color: #B2DCFA;
        }

        /* ช่องใส่รหัสห้องให้ตัวอักษรใหญ่และตัวพิมพ์ใหญ่เสมอ */
        #roomCode {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .btn-join {
            width: 100%;
            height: 55px;
            background-color: #288CF0;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            box-shadow: 0 6px 15px rgba(40, 140, 240, 0.25);
        }

        .btn-join:hover {
            background-color: #1e70c4;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="join-container">
        <div class="card">
            <div class="brand-icon">
                <i class="fa-solid fa-keyboard"></i>
            </div>
            <h1>เข้าสู่ห้องเรียน</h1>
            <p class="subtitle">กรอกรหัสห้องที่ได้รับจากอาจารย์เพื่อเริ่มต้น</p>

            <!-- ฟอร์มส่งข้อมูลไปหน้าพิมพ์ (Typing) -->
            <form action="{{ url_for('api.typing') }}" method="GET">
                <div class="form-group">
                    <label class="form-label">รหัสห้องเรียน (Room Code)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-door-open"></i>
                        <input type="text" id="roomCode" name="room_code" class="form-input" placeholder="เช่น TYP-A9X2" required autocomplete="off" maxlength="8">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">ชื่อเล่น</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="student_name" class="form-input" placeholder="กรอกชื่อของคุณ" required autocomplete="off">
                    </div>
                </div>

                <button type="submit" class="btn-join">
                    เข้าร่วมห้องเรียน <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        // บังคับให้ช่องรหัสห้องพิมพ์ได้เฉพาะภาษาอังกฤษและตัวเลข พร้อมใส่ขีด (-) ให้อัตโนมัติ (ถ้าต้องการ)
        const roomInput = document.getElementById('roomCode');
        roomInput.addEventListener('input', function(e) {
            let val = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
            e.target.value = val;
        });
    </script>
</body>
</html>
