<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบห้องเรียนฝึกพิมพ์</title>
    <!-- นำเข้าฟอนต์ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- นำเข้า FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* ปรับให้หน้าเว็บสูงเต็มจอ 100vh และไม่มีขอบสีเทาแล้ว */
        body {
            background-color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* แถบด้านบน (Topbar) เต็มความกว้าง */
        .topbar {
            background-color: #063376;
            height: 40px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #A0D5FA;
            border-radius: 50%;
        }

        /* พื้นที่เนื้อหาหลัก แบ่ง 2 ฝั่งให้ยืดเต็มจอที่เหลือ */
        .content-area {
            display: flex;
            flex: 1; /* ดันให้เต็มพื้นที่ความสูงที่เหลือ */
            flex-wrap: wrap;
            width: 100%;
        }

        /* ฝั่งซ้าย (พื้นหลังสีฟ้า) */
        .left-panel {
            flex: 1.2;
            background-color: #EBF5FE;
            padding: 60px 5%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-width: 300px;
        }

        /* ขนาดฟอนต์ปรับอัตโนมัติตามความกว้างหน้าจอ */
        .hero-title {
            color: #000;
            font-size: clamp(36px, 4vw, 56px);
            font-weight: 700;
            margin-bottom: 15px;
        }

        .hero-subtitle {
            color: #000;
            font-size: clamp(20px, 2vw, 28px);
            font-weight: 400;
            margin-bottom: 40px;
        }

        .hero-image {
            width: 100%;
            max-width: 600px; /* ขยายรูปให้ใหญ่ขึ้นพอดีจอ */
            height: auto;
            display: block;
        }

        /* ฝั่งขวา (กล่องล็อกอิน) */
        .right-panel {
            flex: 1;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 5%;
            min-width: 300px;
        }

        .login-box {
            width: 100%;
            max-width: 500px; /* ปรับขนาดกล่องล็อกอินให้กว้างขึ้นเล็กน้อย */
        }

        .login-title {
            color: #063376;
            font-size: clamp(24px, 3vw, 32px);
            font-weight: 600;
            text-align: center;
            margin-bottom: 40px;
        }

        /* ปุ่มสลับบทบาท */
        .role-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .role-btn {
            flex: 1;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.15);
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
            color: #063376;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .role-btn.active {
            background-color: #288CF0;
            color: #fff;
            border: 1px solid #288CF0;
        }

        .role-btn i {
            font-size: 22px;
        }

        /* ฟอร์มกรอกข้อมูล */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 22px;
        }

        .form-control {
            width: 100%;
            height: 65px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.15);
            padding: 0 55px; 
            font-size: 20px;
            outline: none;
            color: #333;
            transition: border 0.3s;
        }

        .form-control:focus {
            border-color: #288CF0;
        }

        .form-control::placeholder {
            color: #999;
        }

        .eye-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
            font-size: 20px;
        }

        /* ปุ่มหลัก */
        .btn-primary {
            width: 100%;
            height: 65px;
            background-color: #288CF0;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background-color: #1e70c4;
        }

        /* เส้นแบ่ง */
        .divider {
            display: flex;
            align-items: center;
            margin: 35px 0;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: rgba(0,0,0,0.1);
        }

        .divider span {
            color: #063376;
            padding: 0 20px;
            font-size: 18px;
            font-weight: 500;
        }

        /* ปุ่ม Google */
        .btn-google {
            width: 100%;
            height: 65px;
            background-color: #fff;
            color: #063376;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            transition: background 0.3s;
        }

        .btn-google:hover {
            background-color: #f9f9f9;
        }

        /* ส่วนล่างสุด */
        .footer-text {
            text-align: center;
            margin-top: 35px;
            font-size: 18px;
            font-weight: 600;
            color: #063376;
        }

        .footer-text a {
            color: #288CF0;
            text-decoration: none;
            margin-left: 5px;
        }

        /* Responsive เมื่อเป็นหน้าจอขนาดเล็ก (เช่น มือถือหรือแท็บเล็ตแนวตั้ง) */
        @media (max-width: 992px) {
            .content-area {
                flex-direction: column;
            }
            .left-panel {
                flex: none;
                width: 100%;
                padding: 60px 20px;
            }
            .right-panel {
                flex: none;
                width: 100%;
                padding: 40px 20px 80px;
            }
        }
    </style>
</head>
<body>

    <!-- แถบด้านบน -->
    <header class="topbar">
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </header>

    <!-- พื้นที่เนื้อหาหลัก -->
    <div class="content-area">
        
        <!-- ฝั่งซ้าย (ขยายเต็มหน้าจอฝั่งซ้าย) -->
        <div class="left-panel">
            <h1 class="hero-title">ระบบห้องเรียนฝึกพิมพ์</h1>
            <p class="hero-subtitle">ติดตามพัฒนาการพิมพ์ของนักเรียน</p>
            
            <!-- อย่าลืมเปลี่ยนชื่อไฟล์รูปภาพตรงนี้นะครับ -->
            <img src="https://placehold.co/600x450/EBF5FE/A0D5FA?text=Export+Illustration+Here" alt="Typing Illustration" class="hero-image">
        </div>

        <!-- ฝั่งขวา (ขยายเต็มหน้าจอฝั่งขวา) -->
        <div class="right-panel">
            <div class="login-box">
                <h2 class="login-title">เข้าสู่ระบบ / สมัครสมาชิก</h2>

                <!-- ปุ่มสลับบทบาท -->
                <div class="role-tabs">
                    <button class="role-btn">
                        <i class="fa-solid fa-user"></i> นักเรียน
                    </button>
                    <button class="role-btn active">
                        <i class="fa-solid fa-graduation-cap"></i> อาจารย์
                    </button>
                </div>

                <!-- ฟอร์ม -->
                <form action="#" method="POST">
                    <div class="input-group">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" class="form-control" placeholder="ชื่อผู้ใช้ / อีเมล" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" class="form-control" placeholder="รหัสผ่าน" required>
                        <i class="fa-regular fa-eye eye-icon"></i>
                    </div>

                    <button type="submit" class="btn-primary">เข้าสู่ระบบ</button>
                </form>

                <div class="divider">
                    <span>หรือ</span>
                </div>

                <!-- ปุ่ม Google -->
                <button class="btn-google">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    เข้าสู่ระบบด้วย Google
                </button>

                <p class="footer-text">
                    ยังไม่มีบัญชี? <a href="#">สมัครสมาชิก</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
