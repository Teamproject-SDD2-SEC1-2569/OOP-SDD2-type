register.html<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - ระบบห้องเรียนฝึกพิมพ์</title>
    <!-- นำเข้าฟอนต์ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- นำเข้า FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* แถบด้านบน (Topbar) */
        .topbar {
            background-color: #063376;
            height: 40px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #A0D5FA;
            border-radius: 50%;
        }

        /* พื้นที่เนื้อหาหลัก แบ่ง 2 ฝั่ง */
        .content-area {
            display: flex;
            flex: 1;
            flex-wrap: wrap-reverse; /* ให้ฟอร์มตกลงมาข้างล่างรูปเวลามองในมือถือ */
            width: 100%;
        }

        /* ฝั่งซ้าย (ฟอร์มสมัครสมาชิก) */
        .left-panel {
            flex: 1.3; /* ให้พื้นที่ฝั่งฟอร์มกว้างกว่าเล็กน้อย */
            background-color: #fff;
            padding: 60px 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 300px;
        }

        .page-title {
            color: #063376;
            font-size: clamp(36px, 4vw, 56px);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page-subtitle {
            color: rgba(6, 51, 118, 0.7);
            font-size: clamp(18px, 2vw, 24px);
            font-weight: 500;
            margin-bottom: 40px;
        }

        /* เลือกประเภทผู้ใช้ */
        .role-label {
            color: #063376;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .role-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            max-width: 500px;
        }

        .role-btn {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(0,0,0,0.15);
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
            color: #063376;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .role-btn.active {
            background-color: #288CF0;
            color: #fff;
            border: 1px solid #288CF0;
        }

        /* ฟอร์มกรอกข้อมูลแบบ Grid 2 คอลัมน์ */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-container label {
            color: #063376;
            font-size: 18px;
            font-weight: 600;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 20px;
        }

        .form-control {
            width: 100%;
            height: 60px;
            border-radius: 15px;
            border: 1px solid rgba(0,0,0,0.15);
            padding: 0 55px; 
            font-size: 18px;
            outline: none;
            color: #333;
            transition: border 0.3s;
        }

        .form-control:focus {
            border-color: #288CF0;
        }

        .form-control::placeholder {
            color: #999;
            font-weight: 400;
        }

        .eye-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
            font-size: 18px;
        }

        /* ปุ่มหลัก สมัครสมาชิก */
        .btn-primary {
            width: 100%;
            height: 70px;
            background-color: #288CF0;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 26px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background-color: #1e70c4;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 18px;
            font-weight: 600;
            color: #063376;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-text a {
            color: #288CF0;
            text-decoration: none;
        }

        /* ฝั่งขวา (รูปภาพพื้นหลังสีฟ้า) */
        .right-panel {
            flex: 1;
            background-color: #EBF5FE;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 5%;
            min-width: 300px;
        }

        .hero-image {
            width: 100%;
            max-width: 550px;
            height: auto;
            display: block;
        }

        /* Responsive สำหรับมือถือและแท็บเล็ต */
        @media (max-width: 1024px) {
            .content-area {
                flex-direction: column-reverse; /* ให้ฟอร์มอยู่ล่าง รูปอยู่บน */
            }
            .left-panel {
                flex: none;
                width: 100%;
                padding: 40px 20px 80px;
            }
            .right-panel {
                flex: none;
                width: 100%;
                padding: 60px 20px;
            }
            .form-grid {
                grid-template-columns: 1fr; /* ปรับฟอร์มเป็น 1 คอลัมน์เรียงลงมา */
            }
            .btn-primary {
                height: 60px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- แถบด้านบน -->
    <header class="topbar">
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </header>

    <!-- พื้นที่เนื้อหาหลัก -->
    <div class="content-area">
        
        <!-- ฝั่งซ้าย (ฟอร์มสมัครสมาชิก) -->
        <div class="left-panel">
            <h1 class="page-title">สมัครสมาชิก</h1>
            <p class="page-subtitle">สร้างบัญชีของคุณ เพื่อเริ่มต้นใช้งานระบบ</p>

            <div class="role-label">ประเภทผู้ใช้</div>
            <!-- ปุ่มสลับบทบาท -->
            <div class="role-tabs">
                <!-- ผมตั้งค่าให้ "นักเรียน" เป็นค่าเริ่มต้น (Active) คุณสามารถสลับคลาส active ได้ -->
                <button class="role-btn active">
                    <i class="fa-solid fa-user"></i> นักเรียน
                </button>
                <button class="role-btn">
                    <i class="fa-solid fa-graduation-cap"></i> อาจารย์
                </button>
            </div>

            <!-- ฟอร์ม -->
            <form action="#" method="POST">
                <div class="form-grid">
                    <!-- คอลัมน์ที่ 1: ชื่อผู้ใช้ -->
                    <div class="input-container">
                        <label>ชื่อผู้ใช้</label>
                        <div class="input-group">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" class="form-control" placeholder="กรอกชื่อผู้ใช้" required>
                        </div>
                    </div>

                    <!-- คอลัมน์ที่ 2: รหัสผ่าน -->
                    <div class="input-container">
                        <label>รหัสผ่าน</label>
                        <div class="input-group">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" class="form-control" placeholder="กรอกรหัสผ่าน" required>
                            <i class="fa-regular fa-eye eye-icon"></i>
                        </div>
                    </div>

                    <!-- คอลัมน์ที่ 1: อีเมล -->
                    <div class="input-container">
                        <label>อีเมล</label>
                        <div class="input-group">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" class="form-control" placeholder="กรอกอีเมล" required>
                        </div>
                    </div>

                    <!-- คอลัมน์ที่ 2: ยืนยันรหัสผ่าน -->
                    <div class="input-container">
                        <label>ยืนยันรหัสผ่าน</label>
                        <div class="input-group">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" class="form-control" placeholder="ยืนยันรหัสผ่าน" required>
                            <i class="fa-regular fa-eye eye-icon"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-user-plus"></i> สมัครสมาชิก
                </button>
            </form>

            <div class="footer-text">
                มีบัญชีอยู่แล้ว? <a href="#">เข้าสู่ระบบ</a>
            </div>
        </div>

        <!-- ฝั่งขวา (รูปภาพกราฟิก) -->
        <div class="right-panel">
            <!-- นำรูปภาพที่ Export จาก Figma มาใส่ตรงนี้ -->
            <img src="https://placehold.co/600x600/A0D5FA/063376?text=Export+Illustration+Here" alt="Signup Illustration" class="hero-image">
        </div>

    </div>

</body>
</html>
